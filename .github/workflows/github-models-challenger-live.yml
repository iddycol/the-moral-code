name: GitHub Models Live Scales - Challenger

on:
  workflow_dispatch:
  push:
    branches:
      - implementation/scales-pilot-v0.1
    paths:
      - ".github/workflows/github-models-challenger-live.yml"
      - "engine/scales/reference_runner/providers/github_models_cli.py"

permissions:
  contents: read
  models: read

jobs:
  challenger-live:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_MODELS_MODEL: openai/gpt-4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        working-directory: engine/scales/reference_runner
        run: python -m pip install -r requirements.txt

      - name: Run masked Challenger through GitHub Models
        working-directory: engine/scales/reference_runner
        run: |
          python runner.py \
            --request pilot/P-02-HC-0002/evaluation-request.json \
            --provider command \
            --provider-command "python providers/github_models_cli.py --model openai/gpt-4.1" \
            --provider-name github-models \
            --model openai/gpt-4.1 \
            --model-version hosted-current \
            --constitution-file ../../../constitution/MORAL_CORE.md \
            --interpretation-file ../../../constitution/INTERPRETATION_RULES.md \
            --role-contracts-file ../ROLE_CONTRACTS.md \
            --schemas ../schemas \
            --output-root runs-live \
            --run-id LIVE-GITHUB-MODELS-CHALLENGER-${GITHUB_RUN_ID}

      - name: Upload sealed run ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scales-live-challenger-${{ github.run_id }}
          path: engine/scales/reference_runner/runs-live/
          if-no-files-found: warn
          retention-days: 30
