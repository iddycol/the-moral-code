name: GitHub Models Cross-Model Challenger

on:
  workflow_dispatch:
  push:
    branches:
      - implementation/scales-pilot-v0.1
    paths:
      - ".github/workflows/github-models-cross-model-challenger.yml"

permissions:
  contents: write
  models: read

jobs:
  cross-model:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: implementation/scales-pilot-v0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: engine/scales/reference_runner
        run: python -m pip install -r requirements.txt

      - name: Discover a non-OpenAI GitHub Models chat model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          request = urllib.request.Request(
              "https://models.github.ai/catalog/models",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if isinstance(payload, list):
              models = payload
          elif isinstance(payload, dict):
              models = (
                  payload.get("models")
                  or payload.get("value")
                  or payload.get("items")
                  or []
              )
          else:
              models = []

          preferred = [
              "meta", "llama",
              "mistral",
              "deepseek",
              "cohere", "command",
              "xai", "grok",
              "ai21", "jamba",
          ]

          candidates = []
          for item in models:
              if not isinstance(item, dict):
                  continue
              model_id = item.get("id") or item.get("name") or item.get("model")
              if not isinstance(model_id, str) or not model_id:
                  continue
              publisher = str(item.get("publisher") or item.get("vendor") or "")
              haystack = f"{publisher} {model_id}".lower()
              if "openai" in haystack:
                  continue
              if any(word in haystack for word in ("embedding", "rerank", "speech", "audio", "image")):
                  continue

              capabilities = " ".join(
                  str(item.get(key, ""))
                  for key in ("task", "capabilities", "type", "model_type")
              ).lower()
              # Keep models whose metadata is chat/generation-like or unspecified.
              if capabilities and not any(word in capabilities for word in ("chat", "text", "completion", "generation", "inference")):
                  continue

              rank = len(preferred) + 100
              for i, marker in enumerate(preferred):
                  if marker in haystack:
                      rank = i
                      break
              candidates.append((rank, model_id, publisher))

          if not candidates:
              summary = [
                  (m.get("id") or m.get("name"), m.get("publisher"))
                  for m in models[:25]
                  if isinstance(m, dict)
              ]
              raise SystemExit(f"No usable non-OpenAI model found in GitHub Models catalog. First entries: {summary}")

          candidates.sort(key=lambda x: (x[0], x[1].lower()))
          _, model_id, publisher = candidates[0]
          print(f"model_id={model_id}")
          print(f"publisher={publisher}")
          print(f"catalog_count={len(models)}")
          print(f"candidate_count={len(candidates)}")
          PY

      - name: Execute the sealed Challenger case through the selected model
        id: execute
        working-directory: engine/scales/reference_runner
        shell: bash
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          set +e
          mkdir -p cross-model-evidence
          python runner.py \
            --request pilot/P-02-HC-0002/evaluation-request.json \
            --provider command \
            --provider-command "python providers/github_models_cli.py --model ${MODEL_ID}" \
            --provider-name github-models \
            --model "${MODEL_ID}" \
            --model-version hosted-current \
            --constitution-file ../../../constitution/MORAL_CORE.md \
            --interpretation-file ../../../constitution/INTERPRETATION_RULES.md \
            --role-contracts-file ../ROLE_CONTRACTS.md \
            --schemas ../schemas \
            --output-root runs-live \
            --run-id LIVE-GITHUB-MODELS-CHALLENGER-NONOPENAI-001 \
            > cross-model-evidence/run.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Runner exit status: $status"
          cat cross-model-evidence/run.log
          exit 0

      - name: Build cross-model evidence record
        working-directory: engine/scales/reference_runner
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
          MODEL_PUBLISHER: ${{ steps.model.outputs.publisher }}
          RUN_STATUS: ${{ steps.execute.outputs.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("runs-live")
          evidence_dir = Path("cross-model-evidence")
          status = int(os.environ["RUN_STATUS"])
          model_id = os.environ["MODEL_ID"]
          publisher = os.environ.get("MODEL_PUBLISHER", "")
          selected_run = root / "LIVE-GITHUB-MODELS-CHALLENGER-NONOPENAI-001"
          baseline_run = root / "LIVE-GITHUB-MODELS-CHALLENGER-001"

          record = {
              "comparison_id": "LIVE-GITHUB-MODELS-CHALLENGER-CROSS-MODEL-001",
              "case": "P-02-HC-0002-MASKED",
              "selected_model": model_id,
              "selected_publisher": publisher,
              "provider": "github-models",
              "runner_exit_status": status,
              "strict_contract_success": status == 0,
              "failure_type": None,
              "failure_detail": None,
          }

          if status == 0 and selected_run.exists():
              manifest = json.loads((selected_run / "run-manifest.json").read_text())
              decision = json.loads((selected_run / "decision.json").read_text())
              record["selected_model_result"] = {
                  "outcome": manifest["result"]["outcome"],
                  "directive": manifest["result"]["enforcement_directive"],
                  "moral_floor_breach": manifest["result"]["moral_floor_breach"],
                  "decision_digest": manifest["decision_digest"],
                  "principle_statuses": {
                      x["principle_id"]: x["status"]
                      for x in decision.get("principle_assessments", [])
                  },
              }
              if baseline_run.exists():
                  bm = json.loads((baseline_run / "run-manifest.json").read_text())
                  bd = json.loads((baseline_run / "decision.json").read_text())
                  record["openai_baseline"] = {
                      "model": bm.get("model"),
                      "outcome": bm["result"]["outcome"],
                      "directive": bm["result"]["enforcement_directive"],
                      "moral_floor_breach": bm["result"]["moral_floor_breach"],
                      "decision_digest": bm["decision_digest"],
                      "principle_statuses": {
                          x["principle_id"]: x["status"]
                          for x in bd.get("principle_assessments", [])
                      },
                  }
                  record["comparison"] = {
                      "same_outcome": record["selected_model_result"]["outcome"] == record["openai_baseline"]["outcome"],
                      "same_directive": record["selected_model_result"]["directive"] == record["openai_baseline"]["directive"],
                      "same_moral_floor": record["selected_model_result"]["moral_floor_breach"] == record["openai_baseline"]["moral_floor_breach"],
                  }
          else:
              log = (evidence_dir / "run.log").read_text(errors="replace") if (evidence_dir / "run.log").exists() else ""
              record["failure_type"] = "MODEL_BOUNDARY_FAILURE"
              record["failure_detail"] = log[-12000:]

          out = root / "LIVE-GITHUB-MODELS-CHALLENGER-CROSS-MODEL-001.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY

      - name: Publish success or failure evidence
        working-directory: engine/scales/reference_runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs-live/LIVE-GITHUB-MODELS-CHALLENGER-CROSS-MODEL-001.json
          if [ -d runs-live/LIVE-GITHUB-MODELS-CHALLENGER-NONOPENAI-001 ]; then
            git add runs-live/LIVE-GITHUB-MODELS-CHALLENGER-NONOPENAI-001
          fi
          git commit -m "Publish non-OpenAI Challenger cross-model evidence [skip ci]"
          git push origin HEAD:implementation/scales-pilot-v0.1
