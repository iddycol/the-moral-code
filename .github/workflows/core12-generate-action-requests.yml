name: Core-12 Generate Scales Action Requests

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/core12-live-v0.1
    paths:
      - ".github/workflows/core12-generate-action-requests.yml"
      - "engine/scales/reference_runner/benchmark_adapter.py"
      - "crucible/benchmark/benchmark-v0.1.json"
      - "crucible/benchmark/binding-profiles-v0.1.json"
      - "crucible/historical/cases/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/core12-live-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: engine/scales/reference_runner
        run: python -m pip install -r requirements.txt

      - name: Generate and validate Core action requests
        working-directory: engine/scales/reference_runner
        run: |
          rm -rf core12-generated-v0.1
          python benchmark_adapter.py --output core12-generated-v0.1

      - name: Publish generated sealed inputs
        working-directory: engine/scales/reference_runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core12-generated-v0.1
          if git diff --cached --quiet; then
            echo "No generated input changes"
            exit 0
          fi
          git commit -m "Generate Core-12 action-evaluation requests [skip ci]"
          git push origin HEAD:experiment/core12-live-v0.1
