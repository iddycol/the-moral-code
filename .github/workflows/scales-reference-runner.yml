name: Scales Reference Runner

on:
  push:
    branches:
      - implementation/scales-pilot-v0.1
      - design/scales-v0.1
      - research/provenance-tranche-1
      - experiment/core12-live-v0.1
      - experiment/core12-provenance-v0.1.4
      - main
  pull_request:
    paths:
      - "constitution/**"
      - "crucible/**"
      - "engine/scales/**"
      - ".github/workflows/scales-reference-runner.yml"

permissions:
  contents: read

jobs:
  validate-scales-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The frozen pack verifies bytes; preserve LF in these disposable runners.
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r engine/scales/reference_runner/requirements.txt

      - name: Run Scales regression and packet validation tests
        run: python -m pytest -q engine/scales/reference_runner/tests
