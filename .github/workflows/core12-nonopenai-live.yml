name: Core-12 Live Non-OpenAI Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/core12-live-v0.1
    paths:
      - ".github/workflows/core12-nonopenai-live.yml"

permissions:
  contents: write
  models: read

jobs:
  live-nonopenai:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/core12-live-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: engine/scales/reference_runner
        run: python -m pip install -r requirements.txt

      - name: Discover one suitable non-OpenAI model
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request

          req = urllib.request.Request(
              "https://models.github.ai/catalog/models",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              payload = json.loads(r.read().decode())
          models = payload if isinstance(payload, list) else payload.get("models") or payload.get("value") or payload.get("items") or []

          priority = [
              ("meta", ("meta", "llama")),
              ("mistral", ("mistral",)),
              ("deepseek", ("deepseek",)),
              ("cohere", ("cohere", "command")),
              ("xai", ("xai", "grok")),
          ]
          candidates = []
          for item in models:
              if not isinstance(item, dict):
                  continue
              model_id = item.get("id") or item.get("name") or item.get("model")
              if not isinstance(model_id, str) or not model_id:
                  continue
              publisher = str(item.get("publisher") or item.get("vendor") or "")
              hay = f"{publisher} {model_id}".lower()
              if "openai" in hay or any(x in hay for x in ("embedding", "rerank", "speech", "audio", "image")):
                  continue
              rank, family = 999, "other"
              for i, (name, markers) in enumerate(priority):
                  if any(marker in hay for marker in markers):
                      rank, family = i, name
                      break
              candidates.append((rank, model_id, publisher, family))
          if not candidates:
              raise SystemExit("No non-OpenAI model available")
          candidates.sort(key=lambda x: (x[0], x[1].lower()))
          _, model_id, publisher, family = candidates[0]
          print(f"model_id={model_id}")
          print(f"publisher={publisher}")
          print(f"family={family}")
          PY

      - name: Regenerate sealed Core action requests
        working-directory: engine/scales/reference_runner
        run: |
          rm -rf core12-generated-v0.1
          python benchmark_adapter.py --output core12-generated-v0.1

      - name: Run ten action cases without hiding failures
        working-directory: engine/scales/reference_runner
        shell: bash
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          set -u
          mkdir -p core12-live-nonopenai/action core12-live-nonopenai/evidence
          for n in $(seq -w 1 10); do
            core="CORE-${n}"
            run_id="${core}-NONOPENAI-LIVE-001"
            log="core12-live-nonopenai/evidence/${core}.log"
            set +e
            python runner.py \
              --request "core12-generated-v0.1/${core}/evaluation-request.json" \
              --provider command \
              --provider-command "python providers/github_models_cli.py --model ${MODEL_ID}" \
              --provider-name github-models \
              --model "${MODEL_ID}" \
              --model-version hosted-current \
              --constitution-file ../../../constitution/MORAL_CORE.md \
              --interpretation-file ../../../constitution/INTERPRETATION_RULES.md \
              --role-contracts-file ../ROLE_CONTRACTS.md \
              --schemas ../schemas \
              --output-root core12-live-nonopenai/action \
              --run-id "${run_id}" > "${log}" 2>&1
            status=$?
            set -e
            echo "${status}" > "core12-live-nonopenai/evidence/${core}.status"
            cat "${log}"
            sleep 2
          done

      - name: Run two Repair cases without hiding failures
        working-directory: engine/scales/reference_runner
        shell: bash
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          set -u
          for spec in \
            "CORE-11|RC-0102|../../../crucible/historical/repair-cases/RC-0102-luxembourg-reparations-1952/repair-packet-masked.json" \
            "CORE-12|RC-0103|../../../crucible/historical/repair-cases/RC-0103-south-africa-trc-1995/repair-packet-masked.json"; do
            IFS='|' read -r core case_id packet <<< "$spec"
            run_id="${core}-NONOPENAI-LIVE-001"
            log="core12-live-nonopenai/evidence/${core}.log"
            set +e
            python repair_runner.py \
              --repair-packet "${packet}" \
              --provider-command "python providers/github_models_repair_cli.py --model ${MODEL_ID}" \
              --provider-name github-models \
              --model "${MODEL_ID}" \
              --model-version hosted-current \
              --constitution-file ../../../constitution/MORAL_CORE.md \
              --interpretation-file ../../../constitution/INTERPRETATION_RULES.md \
              --role-contracts-file ../repair/REPAIR_ROLE_CONTRACTS.md \
              --packet-schema ../../../crucible/historical/repair-packet.schema.json \
              --role-schema ../repair/schemas/repair-role-assessment.schema.json \
              --reconciliation-schema ../repair/schemas/repair-reconciliation.schema.json \
              --output-root core12-live-nonopenai/repair \
              --run-id "${run_id}" > "${log}" 2>&1
            status=$?
            set -e
            echo "${status}" > "core12-live-nonopenai/evidence/${core}.status"
            cat "${log}"
            sleep 2
          done

      - name: Build full non-OpenAI Core-12 summary
        working-directory: engine/scales/reference_runner
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
          MODEL_PUBLISHER: ${{ steps.model.outputs.publisher }}
          MODEL_FAMILY: ${{ steps.model.outputs.family }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path("core12-live-nonopenai")
          rows = []
          for i in range(1, 13):
              core = f"CORE-{i:02d}"
              status_path = root / "evidence" / f"{core}.status"
              status = int(status_path.read_text().strip()) if status_path.exists() else 999
              kind = "action" if i <= 10 else "repair"
              run_id = f"{core}-NONOPENAI-LIVE-001"
              run_dir = root / kind / run_id
              row = {
                  "benchmark_case_id": core,
                  "kind": kind,
                  "run_id": run_id,
                  "runner_exit_status": status,
                  "strict_contract_success": status == 0 and run_dir.exists(),
              }
              if row["strict_contract_success"]:
                  m = json.loads((run_dir / "run-manifest.json").read_text())
                  d = json.loads((run_dir / "decision.json").read_text())
                  if kind == "action":
                      row["result"] = {
                          "outcome": m["result"]["outcome"],
                          "directive": m["result"]["enforcement_directive"],
                          "moral_floor_breach": m["result"]["moral_floor_breach"],
                          "decision_digest": m["decision_digest"],
                      }
                  else:
                      row["result"] = {
                          "outcome": m["result"]["outcome"],
                          "directive": m["result"]["implementation_directive"],
                          "failure_checks": m["result"]["failure_checks"],
                          "decision_digest": m["decision_digest"],
                      }
              else:
                  log = (root / "evidence" / f"{core}.log").read_text(errors="replace") if (root / "evidence" / f"{core}.log").exists() else ""
                  row["failure_type"] = "MODEL_BOUNDARY_SCHEMA_OR_PROVIDER_FAILURE"
                  row["failure_detail"] = log[-12000:]
              rows.append(row)

          summary = {
              "evidence_id": "CORE12-LIVE-NONOPENAI-001",
              "provider": "github-models",
              "model": os.environ["MODEL_ID"],
              "publisher": os.environ.get("MODEL_PUBLISHER"),
              "family": os.environ.get("MODEL_FAMILY"),
              "identical_benchmark_contract": "moral-code-benchmark-v0.1",
              "cases": rows,
              "summary": {
                  "case_count": 12,
                  "strict_contract_success_count": sum(1 for x in rows if x["strict_contract_success"]),
                  "failure_count": sum(1 for x in rows if not x["strict_contract_success"]),
              },
          }
          (root / "CORE12-LIVE-NONOPENAI-001.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary["summary"], indent=2))
          PY

      - name: Publish successes and failures
        working-directory: engine/scales/reference_runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core12-live-nonopenai core12-generated-v0.1
          git commit -m "Publish non-OpenAI Core-12 live benchmark evidence [skip ci]"
          git push origin HEAD:experiment/core12-live-v0.1
