name: Historical Crucible Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/historical-crucible-major-cases
  pull_request:
    paths:
      - "crucible/historical/**"
      - ".github/workflows/historical-crucible.yml"

permissions:
  contents: read

jobs:
  validate-historical-crucible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Validate Historical Crucible cases
        run: python crucible/historical/validate_cases.py
